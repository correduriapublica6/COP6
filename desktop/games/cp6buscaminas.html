<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscaminas - Correduría CP6 Edition</title>
    <style>
        :root {
            --gamer-blue: #2563eb;       /* Tono Azul Ejecutivo */
            --gamer-blue-light: #3b82f6;  /* Azul Claro para acentos */
            --cell-size: 36px;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 20px 15px;
            /* Fondo difuminado corporativo */
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 50%, #030712 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Barra superior / Perfil de Usuario corporativo */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 500px;
            margin-bottom: 20px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(37, 99, 235, 0.6);
            padding: 10px 16px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            position: relative;
            z-index: 10;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #030712;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1.5px solid var(--gamer-blue-light);
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.5);
            padding: 5px;
            flex-shrink: 0;
        }

        .user-avatar svg {
            width: 100%;
            height: 100%;
        }

        .user-info h3 {
            margin: 0;
            font-size: 12px;
            color: #f3f4f6;
        }

        .user-info p {
            margin: 1px 0 0 0;
            font-size: 10px;
            color: #93c5fd;
            font-weight: 700;
        }

        .stats {
            display: flex;
            gap: 15px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #cbd5e1;
        }

        .stats span span {
            color: #93c5fd;
            text-shadow: 0 0 8px rgba(147, 197, 253, 0.4);
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* Botón de Nuevo Juego */
        button.btn-new {
            border: none;
            padding: 6px 12px;
            font-weight: 700;
            font-size: 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #2563eb, #1e3a8a);
            color: #fff;
            border: 1px solid rgba(59, 130, 246, 0.4);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        button.btn-new:hover {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.6);
            transform: translateY(-1px);
        }

        /* Grupo de iconos */
        .icon-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .icon-btn {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #cbd5e1;
            font-size: 16px;
            cursor: pointer;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .icon-btn:hover {
            color: #ffffff;
            border-color: var(--gamer-blue-light);
            background: rgba(37, 99, 235, 0.3);
            transform: scale(1.05);
        }

        /* Menú desplegable flotante de configuración */
        .settings-menu {
            position: absolute;
            top: 65px;
            right: 0;
            background: #0f172a;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(59, 130, 246, 0.6);
            box-shadow: 0 10px 30px rgba(0,0,0,0.9), 0 0 15px rgba(37, 99, 235, 0.3);
            display: none;
            z-index: 5000;
            width: max-content;
        }

        .settings-menu.active {
            display: block;
            animation: fadeIn 0.15s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .settings-section h4 {
            margin: 0 0 10px 0;
            font-size: 12px;
            color: #93c5fd;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 4px;
        }

        .difficulty-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .difficulty-options label {
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #cbd5e1;
        }

        .difficulty-options label:hover {
            color: #fff;
        }

        /* Tablero de Buscaminas más abajo y con marco más grueso */
        .board-container {
            background: rgba(15, 23, 42, 0.85);
            padding: 16px;
            border-radius: 16px;
            border: 4px solid var(--gamer-blue-light); /* Marco más grueso */
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), 0 0 15px rgba(37, 99, 235, 0.4);
            display: inline-block;
            margin-top: 35px; /* Un poco más abajo */
        }

        .minefield {
            display: grid;
            gap: 4px;
        }

        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            background: #1e293b;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.08), 0 2px 4px rgba(0,0,0,0.4);
            transition: background 0.15s, transform 0.1s;
            padding: 3px;
        }

        .cell:hover {
            background: #334155;
        }

        .cell.revealed {
            background: #0f172a;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.8);
            cursor: default;
        }

        .cell.mine {
            background: #1e3a8a;
            border: 1px solid var(--gamer-blue-light);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.6);
        }

        /* Ícono del Logotipo dentro de las casillas */
        .logo-icon-cell {
            width: 80%;
            height: 80%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-icon-cell svg {
            width: 100%;
            height: 100%;
        }

        /* Colores numéricos de alto contraste */
        .cell[data-val="1"] { color: #38bdf8; }
        .cell[data-val="2"] { color: #4ade80; }
        .cell[data-val="3"] { color: #f87171; }
        .cell[data-val="4"] { color: #c084fc; }
        .cell[data-val="5"] { color: #facc15; }
        .cell[data-val="6"] { color: #2dd4bf; }
        .cell[data-val="7"] { color: #f472b6; }
        .cell[data-val="8"] { color: #94a3b8; }

        /* Mensaje modal de fin de juego */
        #message-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #0f172a;
            padding: 30px;
            border-radius: 14px;
            text-align: center;
            z-index: 10000;
            border: 2px solid var(--gamer-blue-light);
            box-shadow: 0 0 35px rgba(37, 99, 235, 0.5), 0 15px 40px rgba(0,0,0,0.9);
            width: 320px;
        }

        #message-modal h2 {
            margin-top: 0;
            color: #93c5fd;
            font-size: 22px;
            text-shadow: 0 0 10px rgba(147, 197, 253, 0.6);
        }

        .reward-badge {
            background: rgba(37, 99, 235, 0.3);
            border: 1px solid var(--gamer-blue-light);
            padding: 8px;
            border-radius: 8px;
            margin: 12px 0;
            font-weight: bold;
            color: #93c5fd;
            font-size: 11px;
        }
    </style>
</head>
<body>

    <header>
        <div class="user-profile">
            <div class="user-avatar" title="Correduría CP6">
                <svg viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg">
                    <rect x="2" y="2" width="32" height="32" rx="4" fill="#030712" stroke="#93c5fd" stroke-width="4"/>
                    <rect x="42" y="2" width="32" height="32" rx="4" fill="#030712" stroke="#93c5fd" stroke-width="4"/>
                    <rect x="82" y="2" width="32" height="32" rx="4" fill="#030712" stroke="#93c5fd" stroke-width="4"/>
                    <rect x="42" y="42" width="32" height="32" rx="4" fill="#030712" stroke="#93c5fd" stroke-width="4"/>
                    <rect x="82" y="42" width="32" height="32" rx="4" fill="#030712" stroke="#93c5fd" stroke-width="4"/>
                    <rect x="82" y="82" width="32" height="32" rx="4" fill="#030712" stroke="#93c5fd" stroke-width="4"/>
                </svg>
            </div>
            <div class="user-info">
                <h3 id="userName">Usuario CP6</h3>
                <p>Puntos: <span id="globalScore">0</span></p>
            </div>
        </div>

        <div class="stats">
            <span>MINAS: <span id="flags-count">10</span></span>
            <span>TIEMPO: <span id="timer">00:00</span></span>
        </div>

        <div class="controls">
            <button class="btn-new" onclick="initGame()">Nuevo</button>
            <div class="icon-group">
                <button class="icon-btn" onclick="toggleMenu()" title="Configuración">⚙️</button>
            </div>
        </div>

        <div id="settingsMenu" class="settings-menu">
            <div class="settings-section">
                <h4>DIFICULTAD</h4>
                <div class="difficulty-options">
                    <label><input type="radio" name="difficulty" value="beginner" checked onchange="changeDifficulty(9, 9, 10)"> Principiante (9x9)</label>
                    <label><input type="radio" name="difficulty" value="intermediate" onchange="changeDifficulty(16, 16, 40)"> Intermedio (16x16)</label>
                    <label><input type="radio" name="difficulty" value="expert" onchange="changeDifficulty(16, 30, 99)"> Experto (30x16)</label>
                </div>
            </div>
        </div>
    </header>

    <div class="board-container">
        <div class="minefield" id="minefield" oncontextmenu="return false;"></div>
    </div>

    <div id="message-modal">
        <h2 id="modal-title">¡VICTORIA COMPLETADA! 🏆</h2>
        <div class="reward-badge" id="reward-badge">
            +100 Puntos sumados a tu perfil
        </div>
        <p id="modal-text" style="font-size: 12px; color: #cbd5e1; margin-bottom: 15px;">Has limpiado el campo minado con éxito.</p>
        <button class="btn-new" onclick="initGame()">JUGAR OTRA VEZ</button>
    </div>

    <script>
        // Logotipo SVG idéntico de cuadros dorados
        const logoSvgHTML = `<div class="logo-icon-cell"><svg viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="2" width="32" height="32" rx="4" fill="#030712" stroke="#2563eb" stroke-width="4"/><rect x="42" y="2" width="32" height="32" rx="4" fill="#030712" stroke="#2563eb" stroke-width="4"/><rect x="82" y="2" width="32" height="32" rx="4" fill="#030712" stroke="#2563eb" stroke-width="4"/><rect x="42" y="42" width="32" height="32" rx="4" fill="#030712" stroke="#2563eb" stroke-width="4"/><rect x="82" y="42" width="32" height="32" rx="4" fill="#030712" stroke="#2563eb" stroke-width="4"/><rect x="82" y="82" width="32" height="32" rx="4" fill="#030712" stroke="#2563eb" stroke-width="4"/></svg></div>`;

        const CP6_GAME_NAME = 'Buscaminas';
        const CP6_SESSION_KEY = 'control-avaluos.desktop.session.v1';
        function cp6GameUser() { return sessionStorage.getItem(CP6_SESSION_KEY) || 'Usuario CP6'; }
        function cp6StatsKey() { return `cp6_game_stats_${cp6GameUser()}`; }
        function cp6ReadStats() { try { return JSON.parse(localStorage.getItem(cp6StatsKey()) || '{}') || {}; } catch { return {}; } }
        function cp6WriteStats(stats) { localStorage.setItem(cp6StatsKey(), JSON.stringify(stats)); }
        function recordGameResult(points) {
            const stats = cp6ReadStats();
            const history = Array.isArray(stats.history) ? stats.history : [];
            const result = { game: CP6_GAME_NAME, points: Number(points) || 0, score: Number(points) || 0, completedAt: new Date().toISOString() };
            history.unshift(result);
            stats.history = history.slice(0, 30);
            stats.points = Number(stats.points || 0) + result.points;
            stats.games = Number(stats.games || 0) + 1;
            stats.best = Math.max(Number(stats.best || 0), result.score);
            cp6WriteStats(stats);
        }
        let globalScore = Number(cp6ReadStats().points || 0);

        function updateGlobalScore(points) {
            recordGameResult(points);
            globalScore += Number(points) || 0;
            document.getElementById('globalScore').innerText = globalScore;
        }

        function syncCp6Player() {
            const user = cp6GameUser();
            const name = document.getElementById('userName');
            const stats = cp6ReadStats();
            if (name) name.innerText = user;
            const score = document.getElementById('globalScore');
            if (score) score.innerText = Number(stats.points || 0);
        }

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('globalScore').innerText = globalScore;
            initGame();
        });

        let rows = 9;
        let cols = 9;
        let minesCount = 10;
        
        let board = [];
        let revealedCount = 0;
        let gameOver = false;
        let firstClick = true;
        let seconds = 0;
        let timerInterval = null;
        let flagsLeft = minesCount;
        let gameWonRecorded = false;

        function toggleMenu() {
            document.getElementById('settingsMenu').classList.toggle('active');
        }

        document.addEventListener('click', function(event) {
            let menu = document.getElementById('settingsMenu');
            if (!event.target.closest('.controls') && !event.target.closest('#settingsMenu')) {
                menu.classList.remove('active');
            }
        });

        function changeDifficulty(r, c, m) {
            rows = r;
            cols = c;
            minesCount = m;
            toggleMenu();
            initGame();
        }

        function initGame() {
            document.getElementById('message-modal').style.display = 'none';
            clearInterval(timerInterval);
            seconds = 0;
            document.getElementById('timer').innerText = "00:00";
            gameOver = false;
            firstClick = true;
            revealedCount = 0;
            flagsLeft = minesCount;
            gameWonRecorded = false;
            document.getElementById('flags-count').innerText = flagsLeft;

            const field = document.getElementById('minefield');
            field.style.gridTemplateColumns = `repeat(${cols}, var(--cell-size))`;
            field.innerHTML = '';

            board = [];
            for (let r = 0; r < rows; r++) {
                let row = [];
                for (let c = 0; c < cols; c++) {
                    let cellData = {
                        r, c,
                        mine: false,
                        revealed: false,
                        flagged: false,
                        neighborMines: 0
                    };
                    row.push(cellData);

                    const div = document.createElement('div');
                    div.className = 'cell';
                    div.id = `cell-${r}-${c}`;
                    div.addEventListener('click', () => clickCell(r, c));
                    div.addEventListener('contextmenu', (e) => { e.preventDefault(); flagCell(r, c); });
                    field.appendChild(div);
                }
                board.push(row);
            }
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                seconds++;
                let mins = Math.floor(seconds / 60).toString().padStart(2, '0');
                let secs = (seconds % 60).toString().padStart(2, '0');
                document.getElementById('timer').innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function placeMines(firstR, firstC) {
            let placed = 0;
            while (placed < minesCount) {
                let r = Math.floor(Math.random() * rows);
                let c = Math.floor(Math.random() * cols);
                if (!board[r][c].mine && (Math.abs(r - firstR) > 1 || Math.abs(c - firstC) > 1)) {
                    board[r][c].mine = true;
                    placed++;
                }
            }

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (!board[r][c].mine) {
                        let count = 0;
                        for (let dr = -1; dr <= 1; dr++) {
                            for (let dc = -1; dc <= 1; dc++) {
                                let nr = r + dr, nc = c + dc;
                                if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && board[nr][nc].mine) {
                                    count++;
                                }
                            }
                        }
                        board[r][c].neighborMines = count;
                    }
                }
            }
        }

        function clickCell(r, c) {
            if (gameOver || board[r][c].revealed || board[r][c].flagged) return;

            if (firstClick) {
                placeMines(r, c);
                startTimer();
                firstClick = false;
            }

            if (board[r][c].mine) {
                revealMines(r, c);
                endGame(false);
                return;
            }

            revealCellRecursive(r, c);
            checkWin();
        }

        function revealCellRecursive(r, c) {
            if (r < 0 || r >= rows || c < 0 || c >= cols || board[r][c].revealed || board[r][c].flagged) return;

            board[r][c].revealed = true;
            revealedCount++;

            const div = document.getElementById(`cell-${r}-${c}`);
            div.classList.add('revealed');

            if (board[r][c].neighborMines > 0) {
                div.innerText = board[r][c].neighborMines;
                div.setAttribute('data-val', board[r][c].neighborMines);
            } else {
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        revealCellRecursive(r + dr, c + dc);
                    }
                }
            }
        }

        function flagCell(r, c) {
            if (gameOver || board[r][c].revealed) return;

            const cell = board[r][c];
            const div = document.getElementById(`cell-${r}-${c}`);

            cell.flagged = !cell.flagged;
            if (cell.flagged) {
                div.innerText = '🚩';
                flagsLeft--;
            } else {
                div.innerText = '';
                flagsLeft++;
            }
            document.getElementById('flags-count').innerText = flagsLeft;
        }

        function revealMines(hitR, hitC) {
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const div = document.getElementById(`cell-${r}-${c}`);
                    if (board[r][c].mine) {
                        div.classList.add('revealed', 'mine');
                        // Se coloca el logotipo en lugar de la bomba emoji
                        div.innerHTML = logoSvgHTML;
                        if (r === hitR && c === hitC) {
                            div.style.background = '#2563eb';
                        }
                    }
                }
            }
        }

        function checkWin() {
            if (revealedCount === (rows * cols - minesCount) && !gameWonRecorded) {
                gameWonRecorded = true;
                updateGlobalScore(100);
                endGame(true);
            }
        }

        function endGame(won) {
            gameOver = true;
            clearInterval(timerInterval);
            const modal = document.getElementById('message-modal');
            const title = document.getElementById('modal-title');
            const text = document.getElementById('modal-text');
            const rewardBadge = document.getElementById('reward-badge');

            if (won) {
                title.innerText = "¡VICTORIA COMPLETADA! 🏆";
                text.innerText = `Has despejado el campo en ${document.getElementById('timer').innerText}.`;
                rewardBadge.style.display = 'block';
            } else {
                title.innerText = "¡GAME OVER!";
                text.innerText = "Has encontrado una casilla de la correduría.";
                rewardBadge.style.display = 'none';
            }
            modal.style.display = 'block';
        }
    </script>
</body>
</html>
