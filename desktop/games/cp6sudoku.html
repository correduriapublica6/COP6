<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku - Correduría CP6 Edition</title>
    <style>
        :root {
            --gamer-blue: #2563eb;       /* Tono Azul Ejecutivo */
            --gamer-blue-light: #3b82f6;  /* Azul Claro para acentos */
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 15px;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 50%, #030712 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 440px;
            margin-bottom: 12px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(37, 99, 235, 0.6);
            padding: 8px 16px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #030712;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1.5px solid var(--gamer-blue-light);
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.5);
            padding: 4px;
            flex-shrink: 0;
        }

        .user-avatar svg {
            width: 100%;
            height: 100%;
        }

        .user-info h3 {
            margin: 0;
            font-size: 12px;
            color: #f3f4f6;
        }

        .user-info p {
            margin: 1px 0 0 0;
            font-size: 10px;
            color: #93c5fd;
            font-weight: 700;
        }

        button.btn-new {
            border: none;
            padding: 6px 12px;
            font-weight: 700;
            font-size: 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #2563eb, #1e3a8a);
            color: #fff;
            border: 1px solid rgba(59, 130, 246, 0.4);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        button.btn-new:hover {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            transform: translateY(-1px);
        }

        /* TABLERO DE 440px */
        .sudoku-container {
            width: 440px !important;
            height: 440px !important;
            background: var(--gamer-blue);
            padding: 4px;
            border-radius: 14px;
            border: 2px solid rgba(59, 130, 246, 0.6);
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            grid-template-rows: repeat(9, 1fr);
            gap: 1px;
        }

        .sudoku-cell {
            background-color: #0f172a;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            color: #f8fafc;
            border: none;
            text-align: center;
            outline: none;
            transition: background 0.15s;
            padding: 0;
        }

        .sudoku-cell:focus {
            background-color: #1e293b;
            box-shadow: inset 0 0 6px var(--gamer-blue-light);
        }

        .sudoku-cell.fixed {
            color: #f43f5e;
            background-color: #0b0f19;
            font-weight: 800;
        }

        .sudoku-cell.highlight-same {
            background-color: #1e3a8a !important;
            color: #dbeafe !important;
        }

        .sudoku-cell.error {
            color: #f87171 !important;
            background-color: rgba(239, 68, 68, 0.2) !important;
        }

        .sudoku-cell:nth-child(3n) {
            border-right: 2px solid var(--gamer-blue-light);
        }
        .sudoku-cell:nth-child(9n) {
            border-right: none;
        }
        
        .sudoku-cell:nth-child(n+19):nth-child(-n+27),
        .sudoku-cell:nth-child(n+46):nth-child(-n+54) {
            border-bottom: 2px solid var(--gamer-blue-light);
        }

        /* PANEL DE BOTONES NUMÉRICOS INFERIORES */
        .number-pad {
            display: flex;
            gap: 8px;
            margin-top: 15px;
            width: 440px;
            justify-content: space-between;
        }

        .num-btn {
            background: #0f172a;
            border: 1px solid rgba(37, 99, 235, 0.6);
            color: #f8fafc;
            font-size: 16px;
            font-weight: 700;
            width: 42px;
            height: 42px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        .num-btn span {
            font-size: 9px;
            color: #93c5fd;
            font-weight: 600;
        }

        .num-btn:hover:not(:disabled) {
            background: #1e3a8a;
            border-color: var(--gamer-blue-light);
            transform: translateY(-2px);
        }

        .num-btn.active-pad {
            background: var(--gamer-blue-light) !important;
            color: #fff !important;
        }

        .num-btn:disabled {
            background: #0b0f19;
            color: #334155;
            border-color: #1e293b;
            cursor: not-allowed;
            box-shadow: none;
        }

        .num-btn:disabled span {
            color: #334155;
        }

        #win-message {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #0f172a;
            color: #fff;
            padding: 25px;
            border-radius: 14px;
            text-align: center;
            z-index: 10000;
            border: 2px solid var(--gamer-blue-light);
            box-shadow: 0 0 35px rgba(37, 99, 235, 0.5), 0 15px 40px rgba(0,0,0,0.9);
            width: 300px;
        }

        #win-message h2 {
            margin-top: 0;
            color: #93c5fd;
            font-size: 20px;
        }

        .reward-badge {
            background: rgba(37, 99, 235, 0.3);
            border: 1px solid var(--gamer-blue-light);
            padding: 8px;
            border-radius: 8px;
            margin: 12px 0;
            font-weight: bold;
            color: #93c5fd;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <header>
        <div class="user-profile">
            <div class="user-avatar" title="Correduría CP6">
                <svg viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg">
                    <rect x="2" y="2" width="32" height="32" rx="4" fill="#030712" stroke="#93c5fd" stroke-width="4"/>
                    <rect x="42" y="2" width="32" height="32" rx="4" fill="#030712" stroke="#93c5fd" stroke-width="4"/>
                    <rect x="82" y="2" width="32" height="32" rx="4" fill="#030712" stroke="#93c5fd" stroke-width="4"/>
                    <rect x="42" y="42" width="32" height="32" rx="4" fill="#030712" stroke="#93c5fd" stroke-width="4"/>
                    <rect x="82" y="42" width="32" height="32" rx="4" fill="#030712" stroke="#93c5fd" stroke-width="4"/>
                    <rect x="82" y="82" width="32" height="32" rx="4" fill="#030712" stroke="#93c5fd" stroke-width="4"/>
                </svg>
            </div>
            <div class="user-info">
                <h3 id="userName">Lic. Alejandro Garza</h3>
                <p>Puntos: <span id="globalScore">0</span></p>
            </div>
        </div>

        <div class="controls">
            <button class="btn-new" onclick="newGame()">Nuevo</button>
        </div>
    </header>

    <div class="sudoku-container" id="sudokuGrid"></div>

    <div class="number-pad" id="numberPad"></div>

    <div id="win-message">
        <h2>¡SUDOKU COMPLETADO! 🏆</h2>
        <p style="color: #cbd5e1; font-size: 12px;">Has resuelto el reto correctamente.</p>
        <div class="reward-badge">
            +100 Puntos sumados a tu perfil
        </div>
        <button class="btn-new" onclick="newGame()">JUGAR OTRO</button>
    </div>

    <script>
        const CP6_GAME_NAME = 'Sudoku';
        const CP6_SESSION_KEY = 'control-avaluos.desktop.session.v1';
        function cp6GameUser() { return sessionStorage.getItem(CP6_SESSION_KEY) || 'Usuario CP6'; }
        function cp6StatsKey() { return `cp6_game_stats_${cp6GameUser()}`; }
        function cp6ReadStats() { try { return JSON.parse(localStorage.getItem(cp6StatsKey()) || '{}') || {}; } catch { return {}; } }
        function cp6WriteStats(stats) { localStorage.setItem(cp6StatsKey(), JSON.stringify(stats)); }
        function recordGameResult(points) {
            const stats = cp6ReadStats();
            const history = Array.isArray(stats.history) ? stats.history : [];
            const result = { game: CP6_GAME_NAME, points: Number(points) || 0, score: Number(points) || 0, completedAt: new Date().toISOString() };
            history.unshift(result);
            stats.history = history.slice(0, 30);
            stats.points = Number(stats.points || 0) + result.points;
            stats.games = Number(stats.games || 0) + 1;
            stats.best = Math.max(Number(stats.best || 0), result.score);
            cp6WriteStats(stats);
        }
        let globalScore = Number(cp6ReadStats().points || 0);
        function updateGlobalScore(points) {
            recordGameResult(points);
            globalScore += Number(points) || 0;
            const score = document.getElementById('globalScore');
            if (score) score.innerText = globalScore;
        }
        function syncCp6Player() {
            const stats = cp6ReadStats();
            const name = document.getElementById('userName');
            const score = document.getElementById('globalScore');
            if (name) name.innerText = cp6GameUser();
            if (score) score.innerText = Number(stats.points || 0);
        }
        const gamePool = [
            {
                puzzle: [
                    "530070000",
                    "600195000",
                    "098000060",
                    "800060003",
                    "400803001",
                    "700020006",
                    "060000280",
                    "000419005",
                    "000080079"
                ],
                solution: [
                    [5,3,4,6,7,8,9,1,2],
                    [6,7,2,1,9,5,3,4,8],
                    [1,9,8,3,4,2,5,6,7],
                    [8,5,9,7,6,1,4,2,3],
                    [4,2,6,8,5,3,7,9,1],
                    [7,1,3,9,2,4,8,5,6],
                    [9,6,1,5,3,7,2,8,4],
                    [2,8,7,4,1,9,6,3,5],
                    [3,4,5,2,8,6,1,7,9]
                ]
            },
            {
                puzzle: [
                    "000260701",
                    "680070090",
                    "190004500",
                    "820100040",
                    "004602900",
                    "050003028",
                    "009300074",
                    "040050036",
                    "703018000"
                ],
                solution: [
                    [4,3,5,2,6,9,7,8,1],
                    [6,8,2,5,7,1,4,9,3],
                    [1,9,7,8,3,4,5,6,2],
                    [8,2,6,1,9,5,3,4,7],
                    [3,7,4,6,8,2,9,1,5],
                    [9,5,1,7,4,3,6,2,8],
                    [5,1,9,3,2,6,8,7,4],
                    [2,4,8,9,5,7,1,3,6],
                    [7,6,3,4,1,8,2,5,9]
                ]
            }
        ];

        let currentBoard = [];
        let solutionBoard = [];
        let activeSelectedCell = null;

        function parseBoard(strArray) {
            return strArray.map(row => row.split('').map(Number));
        }

        function newGame() {
            document.getElementById('win-message').style.display = 'none';
            const randomGame = gamePool[Math.floor(Math.random() * gamePool.length)];
            currentBoard = parseBoard(randomGame.puzzle);
            solutionBoard = randomGame.solution;
            activeSelectedCell = null;
            renderGrid();
            renderNumberPad();
        }

        function highlightSameNumbers(num) {
            const allInputs = document.querySelectorAll('.sudoku-cell');
            allInputs.forEach(cell => {
                cell.classList.remove('highlight-same');
                if (num && cell.value === num) {
                    cell.classList.add('highlight-same');
                }
            });

            const padButtons = document.querySelectorAll('.num-btn');
            padButtons.forEach(btn => {
                btn.classList.remove('active-pad');
                if (num && btn.dataset.num === num) {
                    btn.classList.add('active-pad');
                }
            });
        }

        function updateNumberPadCounts() {
            const counts = {};
            for (let i = 1; i <= 9; i++) counts[i] = 0;

            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    let val = currentBoard[r][c];
                    if (val >= 1 && val <= 9) {
                        counts[val]++;
                    }
                }
            }

            for (let i = 1; i <= 9; i++) {
                const btn = document.getElementById(`pad-btn-${i}`);
                const span = document.getElementById(`pad-count-${i}`);
                if (btn && span) {
                    let remaining = 9 - counts[i];
                    span.innerText = remaining > 0 ? remaining : '✓';
                    if (remaining <= 0) {
                        btn.disabled = true;
                    } else {
                        btn.disabled = false;
                    }
                }
            }
        }

        function renderNumberPad() {
            const pad = document.getElementById('numberPad');
            pad.innerHTML = '';

            for (let i = 1; i <= 9; i++) {
                const btn = document.createElement('button');
                btn.className = 'num-btn';
                btn.id = `pad-btn-${i}`;
                btn.dataset.num = i.toString();
                btn.innerHTML = `${i}<span id="pad-count-${i}">9</span>`;

                // CORRECCIÓN: Al presionar el botón inferior, SOLAMENTE resalta los números.
                // Ya no sobreescribe ni cambia ninguna celda por error.
                btn.addEventListener('click', () => {
                    highlightSameNumbers(i.toString());
                });

                pad.appendChild(btn);
            }
            updateNumberPadCounts();
        }

        function renderGrid() {
            const grid = document.getElementById('sudokuGrid');
            grid.innerHTML = '';

            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.maxLength = 1;
                    input.className = 'sudoku-cell';
                    input.dataset.row = r;
                    input.dataset.col = c;
                    
                    const val = currentBoard[r][c];
                    if (val !== 0) {
                        input.value = val;
                        input.readOnly = true;
                        input.classList.add('fixed');
                    } else {
                        input.addEventListener('input', (e) => {
                            let v = parseInt(e.target.value);
                            if (isNaN(v) || v < 1 || v > 9) {
                                e.target.value = '';
                                currentBoard[r][c] = 0;
                                input.classList.remove('error');
                                highlightSameNumbers(null);
                            } else {
                                currentBoard[r][c] = v;
                                highlightSameNumbers(e.target.value);
                                if (v !== solutionBoard[r][c]) {
                                    input.classList.add('error');
                                } else {
                                    input.classList.remove('error');
                                }
                                updateNumberPadCounts();
                                checkWinCondition();
                            }
                        });
                    }

                    input.addEventListener('focus', (e) => {
                        activeSelectedCell = e.target;
                        if (e.target.value) {
                            highlightSameNumbers(e.target.value);
                        } else {
                            highlightSameNumbers(null);
                        }
                    });

                    grid.appendChild(input);
                }
            }
            updateNumberPadCounts();
        }

        function checkWinCondition() {
            let isComplete = true;
            let isCorrect = true;

            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    if (currentBoard[r][c] === 0) isComplete = false;
                    if (currentBoard[r][c] !== solutionBoard[r][c]) isCorrect = false;
                }
            }

            if (isComplete && isCorrect) {
                updateGlobalScore(100);
                document.getElementById('win-message').style.display = 'block';
            }
        }
    </script>
</body>
</html>
